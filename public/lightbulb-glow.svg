<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" fill="none">
  <style>
    :root {
      --stroke: #76C79E; /* main line color */
      --glow:   #B6F1CF; /* glow color (brighter mint) */
    }
    .s { stroke: var(--stroke); }
    .g { stroke: var(--glow); }
  </style>

  <!-- Glow filter -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <!-- soften -->
      <feGaussianBlur stdDeviation="6" result="blur"></feGaussianBlur>
      <!-- brighten the blur slightly -->
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="blur"></feMergeNode>
      </feMerge>
    </filter>
  </defs>

  <!-- ===== GLOW LAYER (under) ===== -->
  <g class="g" opacity="0.65" filter="url(#glow)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer bulb + neck -->
    <path stroke-width="18" d="M60 20 H140 L180 60 V150 L120 210 V230 H80 V210 L20 150 V60 Z"></path>
    <!-- Filament -->
    <path stroke-width="16" d="M70 85 L100 115 L130 85 M100 115 V160"></path>
    <!-- Neck posts -->
    <path stroke-width="16" d="M80 230 V236 M120 230 V236"></path>
    <!-- Ribs + cap -->
    <rect x="60" y="238" width="80" height="14" rx="4" stroke-width="18"></rect>
    <rect x="60" y="258" width="80" height="14" rx="4" stroke-width="18"></rect>
    <rect x="60" y="278" width="80" height="14" rx="4" stroke-width="18"></rect>
    <rect x="86" y="296" width="28" height="10" rx="5" stroke-width="18"></rect>
  </g>

  <!-- ===== STROKE LAYER (top) ===== -->
  <g class="s" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M60 20 H140 L180 60 V150 L120 210 V230 H80 V210 L20 150 V60 Z"></path>
    <path d="M70 85 L100 115 L130 85 M100 115 V160"></path>
    <path d="M80 230 V236 M120 230 V236"></path>
    <rect x="60" y="238" width="80" height="14" rx="4"></rect>
    <rect x="60" y="258" width="80" height="14" rx="4"></rect>
    <rect x="60" y="278" width="80" height="14" rx="4"></rect>
    <rect x="86" y="296" width="28" height="10" rx="5"></rect>
  </g>
</svg>
